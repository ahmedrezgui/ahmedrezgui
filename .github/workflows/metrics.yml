
name: GitHub Contribution Metrics

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate full-year contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ahmedrezgui
          filename: metrics.plugin.isocalendar.fullyear.svg

          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          output_action: commit
          committer_branch: main
          committer_message: "chore: update contribution metrics [skip ci]"
